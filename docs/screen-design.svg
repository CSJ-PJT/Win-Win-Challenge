<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#f4f6f4"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" fill="#182e2a">
<text x="32" y="43" font-size="25" font-weight="bold">안심동행 플랫폼 · 역할별 화면설계</text>
<text x="32" y="74" font-size="15">기획서 화면 구성도 · 실제 실행 캡처와 구분</text>
<g transform="translate(24 100)"><rect width="276" height="510" rx="20" fill="white" stroke="#dce6e0"/><text x="20" y="37" font-size="19" font-weight="bold">V01 · 인계자</text><text x="20" y="82" font-size="23" font-weight="bold">오늘의 동행을</text><text x="20" y="113" font-size="23" font-weight="bold">준비해요</text><rect x="16" y="144" width="244" height="100" rx="12" fill="#eaf5ef"/><text x="29" y="173" font-size="16">도착지 · 상세주소</text><text x="29" y="202" font-size="14">저장한 방문 정보</text><text x="29" y="225" font-size="14">지도에서 확인하기</text><rect x="16" y="263" width="244" height="58" rx="12" fill="#115441"/><text x="138" y="299" text-anchor="middle" fill="white" font-size="18">방문 시작하기</text><rect x="16" y="336" width="244" height="53" rx="12" fill="#eaf5ef"/><text x="138" y="369" text-anchor="middle" font-size="17">도착지 변경</text><text x="22" y="435" font-size="15">출발 → 도착 → 연결번호</text><text x="22" y="462" font-size="15">직접 인계 확인</text></g>
<g transform="translate(316 100)"><rect width="276" height="510" rx="20" fill="white" stroke="#dce6e0"/><text x="20" y="37" font-size="19" font-weight="bold">F02 · 시설 담당자</text><text x="20" y="82" font-size="23" font-weight="bold">방문자가</text><text x="20" y="113" font-size="23" font-weight="bold">도착했어요</text><text x="22" y="164" font-size="16">담당 방문 · 승하차 장소</text><rect x="16" y="193" width="244" height="65" rx="12" fill="#f4f6f4" stroke="#dce6e0"/><text x="138" y="233" text-anchor="middle" font-size="21">연결번호 6자리</text><text x="22" y="294" font-size="15">인계자의 확인 상태</text><rect x="16" y="323" width="244" height="65" rx="12" fill="#115441"/><text x="138" y="363" text-anchor="middle" fill="white" font-size="18">직접 인수했어요</text><text x="22" y="435" font-size="15">양측 확인 후 완료</text><text x="22" y="462" font-size="15">연락하기 · 도착 알림 확인</text></g>
<g transform="translate(608 100)"><rect width="276" height="510" rx="20" fill="white" stroke="#dce6e0"/><text x="20" y="37" font-size="19" font-weight="bold">G01 · 보호자 조회</text><text x="20" y="82" font-size="23" font-weight="bold">진행 상황을</text><text x="20" y="113" font-size="23" font-weight="bold">확인해요</text><g font-size="18"><text x="25" y="181">방문 준비</text><text x="25" y="227">출발</text><text x="25" y="273">도착</text><text x="25" y="319">인계자 확인</text><text x="25" y="365">시설 담당자 확인</text></g><path d="M18 397H258" stroke="#dce6e0"/><text x="22" y="435" font-size="15">조회 전용</text><text x="22" y="462" font-size="15">연결번호는 표시하지 않음</text></g>
<g transform="translate(900 100)"><rect width="276" height="510" rx="20" fill="white" stroke="#dce6e0"/><text x="20" y="37" font-size="19" font-weight="bold">E03 · 쉬운 화면</text><text x="20" y="92" font-size="27" font-weight="bold">방문할 곳에</text><text x="20" y="132" font-size="27" font-weight="bold">도착하셨나요?</text><text x="22" y="187" font-size="17">시설 · 승하차 장소</text><rect x="16" y="224" width="244" height="80" rx="15" fill="#115441"/><text x="138" y="274" text-anchor="middle" fill="white" font-size="25">도착 알리기</text><rect x="16" y="326" width="244" height="80" rx="15" fill="#eaf5ef"/><text x="138" y="376" text-anchor="middle" font-size="25">연락하기</text><text x="22" y="455" font-size="15">동의 → 도착 소식 → 확인</text><text x="22" y="482" font-size="15">큰 글씨 · 큰 버튼</text></g>
</g></svg>
