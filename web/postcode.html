<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>주소 검색</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#fff}body{display:flex;flex-direction:column}#status{padding:12px 16px;font-size:16px;color:#465f57}#picker{width:100%;flex:1;min-height:360px}#retry{display:block;margin:12px 16px;padding:14px;background:#155e4c;color:white;border:0;border-radius:10px;font-size:17px}#retry[hidden],#status[hidden]{display:none}
</style><script src="address.js"></script></head><body><div id="status" role="status">주소 검색을 불러오고 있어요.</div><button id="retry" hidden>다시 연결하기</button><div id="picker"></div><script>
(function(){'use strict';let opts={};try{opts=JSON.parse(decodeURIComponent(location.hash.slice(1)));}catch{}let dispose=null;const status=document.getElementById('status'),retry=document.getElementById('retry');function start(){dispose?.();retry.hidden=true;status.hidden=false;status.textContent='주소 검색을 불러오고 있어요.';dispose=AddressPicker.mount(document.getElementById('picker'),{query:opts.query||'',onready:()=>{status.hidden=true;console.info('ADDRESS_PICKER_READY');},onerror:e=>{status.hidden=false;status.textContent=e.message;retry.hidden=false;},onselect:result=>{location.href='https://appassets.androidplatform.net/postcode-result#'+encodeURIComponent(JSON.stringify({requestId:opts.requestId,result}));}});}retry.addEventListener('click',start);start();})();
</script></body></html>
