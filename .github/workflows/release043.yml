name: Verified address search and release 0.4.3
on:
  workflow_dispatch:
  push:
    branches: [feature/address-ux-0.4.3, feature/pm-api-screen-0.4.3]
    paths: [.github/workflows/release043.yml, web/**, android/**, test/**, package.json, README.md]
permissions:
  contents: write
concurrency:
  group: ansim-042-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Capture tested source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain and service tests
        run: |
          mkdir -p build-reports/v043
          git rev-parse HEAD > build-reports/v043/source-sha.txt
          npm test | tee build-reports/v043/node-tests.txt
          npm run bundle
      - name: Browser input and role regressions
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.57.0
          if ! command -v chromium >/dev/null; then
            ln -s "$(command -v google-chrome)" "$RUNNER_TEMP/chromium"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          python3 -u test/flow040.py --output build-reports/v043/flow
          python3 -u test/role_tabs041.py --output build-reports/v043/tabs
          python3 -u test/address042_mock.py --fixture --output build-reports/v043/address-ui
          timeout -k 5s 90s python3 -u test/flow040_http.py --output build-reports/v043/http
          rm -f build-reports/v043/http/server-private.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed Android package and UI test package
        env:
          DEMO_KEYSTORE: ${{ runner.temp }}/preview.jks
          DEMO_STORE_PASSWORD: preview-ci-only
        run: |
          cp web/*.js web/style.css web/postcode.html android/app/src/main/assets/
          cp dist/handoff-demo.html android/app/src/main/assets/index.html
          keytool -genkeypair -keystore "$DEMO_KEYSTORE" -storepass "$DEMO_STORE_PASSWORD" -keypass "$DEMO_STORE_PASSWORD" -alias demo -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Ansim Preview, O=Contest Prototype, C=KR'
          gradle -p android --no-daemon --max-workers=2 assembleRelease assembleReleaseAndroidTest 2>&1 | tee build-reports/v043/gradle.txt
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/ansim-platform-0.4.3-preview.apk
          cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk apk/ansim-address-tests.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --print-certs apk/ansim-platform-0.4.3-preview.apk > build-reports/v043/signature.txt
          sha256sum apk/ansim-platform-0.4.3-preview.apk > build-reports/v043/apk-sha256.txt
      # Verify actual package metadata before QA handoff.
      - name: Build isolated coexisting QA package and instrumentation
        env:
          DEMO_KEYSTORE: ${{ runner.temp }}/preview.jks
          DEMO_STORE_PASSWORD: preview-ci-only
        run: |
          gradle -p android --no-daemon --max-workers=2 -PansimTestBuildType=deviceQa assembleDeviceQa assembleDeviceQaAndroidTest 2>&1 | tee build-reports/v043/qa-gradle.txt
          mkdir -p qa-package
          cp android/app/build/outputs/apk/deviceQa/app-deviceQa.apk qa-package/ansim-platform-0.4.3-qa.apk
          cp android/app/build/outputs/apk/androidTest/deviceQa/app-deviceQa-androidTest.apk qa-package/ansim-qa-tests.apk
          python3 tools/qa_package_manifest.py | tee build-reports/v043/qa-package-check.txt
      - name: Package source and PC launcher
        run: |
          python3 - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          entries=subprocess.check_output(['git','ls-files','-z','web','android','test','tools','docs','server.js','package.json','README.md','.github','.gitignore','start-demo.cmd','start-demo.sh','PC 실행.cmd']).decode().split('\0')
          with zipfile.ZipFile('ansim-platform-0.4.3-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in entries:
                  if item and Path(item).is_file():z.write(item,item)
          with zipfile.ZipFile('ansim-platform-0.4.3-pc.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in ['dist/handoff-demo.html','tools/serve-demo.cjs','PC 실행.cmd']:z.write(item,item)
              z.writestr('실행안내.txt','안심동행 플랫폼 0.4.3\n\nNode.js 22 이상이 설치된 PC에서 압축을 풀고 PC 실행.cmd를 실행합니다.\n주소 검색은 인터넷 연결이 필요합니다. HTML 파일을 직접 열지 말고 실행 파일을 사용합니다.\n브라우저 주소: http://127.0.0.1:18420\n종료: 실행 창에서 Ctrl+C\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansim-0.4.3-build
          path: |
            apk/ansim-platform-0.4.3-preview.apk
            apk/ansim-address-tests.apk
            qa-package/
            dist/handoff-demo.html
            build-reports/v043/
            ansim-platform-0.4.3-source.zip
            ansim-platform-0.4.3-pc.zip
          retention-days: 14
  live-address:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-build.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official postcode results and maps without mock responses
        run: |
          npm run bundle
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.57.0
          python3 -u test/address042_live.py --output build-reports/v043/live-address
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansim-0.4.3-live-address
          path: build-reports/v043/live-address/
          retention-days: 14
  native-smoke:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-build.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ansim-0.4.3-build
          path: build-input
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Touch installed APK and select an official Korean address
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash test/native043.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansim-0.4.3-native
          path: native-results/
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/feature/address-ux-0.4.3'
    needs: [verify-build, live-address, native-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ansim-0.4.3-build
          path: release-input
      - name: Publish private preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## 안심동행 플랫폼 0.4.3
          카카오 우편번호 검색창에서 선택한 주소와 우편번호를 가져와 저장합니다. 입력 중인 내용과 역할별 방문 진행 상태를 유지합니다. 주소 검색 버튼은 주소 입력란 옆에 배치했습니다.
          
          PC는 압축을 풀고 PC 실행.cmd로 실행합니다(Node.js 22 이상). HTML 직접 열기는 공식 주소 반환을 지원하지 않습니다. Android APK에는 별도의 주소 검색 창이 포함됩니다.
          
          주소만 있을 때는 카카오맵 위치 검색, 좌표가 있으면 길찾기로 연결합니다. Google 지도도 선택할 수 있습니다. 이전 시험판과 서명이 다르면 삭제 후 설치해야 하며 저장 기록이 지워집니다.
          EOF
          gh release view v0.4.3-preview >/dev/null 2>&1 || gh release create v0.4.3-preview --target '${{ needs.verify-build.outputs.source_sha }}' --prerelease --title '안심동행 플랫폼 0.4.3' --notes-file /tmp/notes.md
          gh release upload v0.4.3-preview release-input/apk/ansim-platform-0.4.3-preview.apk release-input/ansim-platform-0.4.3-pc.zip release-input/ansim-platform-0.4.3-source.zip --clobber

