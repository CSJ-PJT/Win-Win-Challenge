name: Verify and build Ansim preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - 'server.js'
      - 'test/**'
      - 'android/**'
      - 'tools/bundle.js'
      - 'package.json'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: ansim-preview-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test domain and HTTP service
        run: |
          mkdir -p build-reports/v020
          npm test | tee build-reports/v020/node-tests.txt
          npm run bundle
      - name: Test UI and real browser synchronization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk > /dev/null
          fc-match 'Noto Sans CJK KR'
          python3 -m pip install --quiet playwright==1.57.0
          python3 test/browser_smoke.py --output build-reports/v020/browser
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android assets and preview signing key
        run: |
          cp web/*.js web/style.css android/app/src/main/assets/
          cp dist/handoff-demo.html android/app/src/main/assets/index.html
          keytool -genkeypair -keystore "$RUNNER_TEMP/preview.jks" -storepass preview-ci-only -keypass preview-ci-only -alias demo -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Ansim Preview, O=Contest Prototype, C=KR'
      - name: Build preview APK without an emulator
        env:
          DEMO_KEYSTORE: ${{ runner.temp }}/preview.jks
          DEMO_STORE_PASSWORD: preview-ci-only
        run: |
          gradle -p android --no-daemon --max-workers=2 assembleRelease 2>&1 | tee build-reports/v020/gradle-build.txt
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/ansim-platform-0.2.0-preview.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --print-certs apk/ansim-platform-0.2.0-preview.apk | tee build-reports/v020/apk-signature.txt
          sha256sum apk/ansim-platform-0.2.0-preview.apk > build-reports/v020/apk-sha256.txt
          echo 'This run builds and verifies the APK signature. Android/Pleos runtime testing is not included.' > build-reports/v020/native-scope.txt
      - name: Preserve preview and source revision
        run: |
          git rev-parse HEAD > build-reports/v020/source-revision.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/ansim-platform-0.2.0-preview.apk build-reports/v020 dist android/app/src/main/assets
          git diff --cached --quiet || git commit -m 'build: archive 0.2.0 preview and verification [skip ci]'
          git push
          git archive --format=zip HEAD -o ansim-platform-0.2.0-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ansim-platform-0.2.0-preview
          path: |
            apk/ansim-platform-0.2.0-preview.apk
            dist/handoff-demo.html
            build-reports/v020/
            ansim-platform-0.2.0-source.zip
          retention-days: 14
